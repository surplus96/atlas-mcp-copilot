services:
  atlas-mcp:
    build: .
    ports:
      # Host-side 3100, not 3000 — Atlas CMMS's own nginx already occupies host
      # port 3000 in this setup (see /Users/surplus96/projects/atlas-cmms). The
      # container's internal port stays 3000 (matches MCP_PORT/healthcheck below).
      - "127.0.0.1:3100:3000"
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal:8080}
      API_EMAIL: ${API_EMAIL}
      API_PASSWORD: ${API_PASSWORD}
      MCP_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_EXPIRY_BUFFER_MINUTES: ${JWT_EXPIRY_BUFFER_MINUTES:-5}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
